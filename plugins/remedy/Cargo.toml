[package]
name = "remedy"
version = "0.1.0"
edition = "2021"
authors = ["Hodiloves"]
license = "GPL-3.0-or-later"
description = "Remedy - a wavetable synthesizer (VST3 / CLAP)"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "remedy-standalone"
path = "src/main.rs"

[dependencies]
nih_plug = { workspace = true, features = ["vst3", "standalone"] }
nih_plug_egui = { workspace = true }
plugin_common = { workspace = true }
